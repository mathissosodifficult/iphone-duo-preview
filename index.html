<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0f12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='11' height='22' rx='3' fill='none' stroke='%23d4f86a' stroke-width='2'/%3E%3Crect x='18' y='5' width='11' height='22' rx='3' fill='none' stroke='%23d4f86a' stroke-width='2'/%3E%3C/svg%3E">
  <title>iPhone Duo — 可折叠交互概念模型</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="app">
    <aside class="info-panel" aria-label="模型信息">
      <header class="brand"><svg class="brand-mark" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="5" width="12" height="24" rx="3" stroke="currentColor" stroke-width="1.5"/><rect x="19" y="5" width="12" height="24" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M17 9v16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><div><strong>DUO</strong><span>DESIGN STUDY · 001</span></div></header>
      <section class="hero-copy"><p class="kicker">FOLDABLE CONCEPT</p><h1>iPhone<br>Duo<span>®</span></h1><p class="intro">双屏，不止两种可能。<br>自由旋转，探索每一种开合姿态。</p></section>
      <dl class="spec-list"><div><dt>显示</dt><dd>独立双屏 · 连续壁纸</dd></div><div><dt>铰链</dt><dd>0–180° 无极开合</dd></div><div><dt>机身</dt><dd>金属中框 · 双摄影像</dd></div></dl>
      <section class="finish-picker" aria-labelledby="finish-label"><div class="section-label"><span id="finish-label">机身配色</span><span id="finish-name">钛黑</span></div><div class="swatches" role="group" aria-label="选择机身配色"><button class="swatch is-active" type="button" data-finish="graphite" aria-label="钛黑" aria-pressed="true"><span style="--swatch:#363c40"></span></button><button class="swatch" type="button" data-finish="silver" aria-label="星银" aria-pressed="false"><span style="--swatch:#c5c8c4"></span></button><button class="swatch" type="button" data-finish="blue" aria-label="深空蓝" aria-pressed="false"><span style="--swatch:#405b69"></span></button></div></section>
      <footer class="panel-footer"><div class="gesture-hint"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 11V7a2 2 0 0 1 4 0v3-5a2 2 0 0 1 4 0v5-2a2 2 0 0 1 4 0v6c0 4-2.6 7-7 7-3 0-5-1.4-6.5-4L3 11a2 2 0 0 1 3.4-2L8 11Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>拖拽旋转 · 滚轮缩放</span></div><p>非官方概念设计 · REAL-TIME 3D</p></footer>
    </aside>
    <section id="stage" aria-label="iPhone Duo 三维交互展示区">
      <div id="viewport"></div>
      <div class="stage-topbar"><div class="live-status"><span></span> LIVE MODEL</div><div class="stage-actions"><button id="reset-view" class="icon-button" type="button" aria-label="重置视角" title="重置视角"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.6 15a8 8 0 0 0 13.2 2M18.4 9A8 8 0 0 0 5.2 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button id="fullscreen" class="icon-button" type="button" aria-label="进入全屏" title="全屏"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
      <div id="loading" role="status" aria-live="polite"><div class="loader-device" aria-hidden="true"><span></span><span></span></div><p>正在装配 Duo</p></div>
      <div id="load-error" hidden role="alert"><strong>无法启动 3D 视图</strong><p>请使用支持 WebGL 的浏览器并开启硬件加速。</p></div>
      <div class="model-index" aria-hidden="true"><span>DUO / 01</span><span>ASSEMBLED VIEW</span></div>
      <section class="control-dock" aria-label="模型控制台">
        <button id="fold-toggle" class="fold-button" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h6v14H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2ZM14 5h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 3v18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>合拢</span></button>
        <div class="angle-control"><div class="angle-label"><label for="angle-slider">开合角度</label><output id="angle-output" for="angle-slider">180°</output></div><input id="angle-slider" type="range" min="0" max="180" step="1" value="180" aria-label="开合角度，0度合拢，180度展开"><div class="range-labels" aria-hidden="true"><span>0°</span><span>180°</span></div></div>
        <div class="dock-divider" aria-hidden="true"></div>
        <div class="view-presets" role="group" aria-label="预设视角"><button class="is-active" type="button" data-view="hero" aria-pressed="true">立体</button><button type="button" data-view="front" aria-pressed="false">正面</button><button type="button" data-view="back" aria-pressed="false">背面</button><button type="button" data-view="hinge" aria-pressed="false">铰链</button></div>
        <button id="rotate-toggle" class="rotate-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.1 8a7 7 0 0 1 11.8-1L20 12M4 12l2.1 5a7 7 0 0 0 11.8-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>自动旋转</span></button>
      </section>
    </section>
  </main>
  <script type="module" src="./src/scene.js"></script>
</body>
</html>
